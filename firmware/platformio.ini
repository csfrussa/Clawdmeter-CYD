[env:esp32_cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
board_build.partitions = huge_app.csv
framework = arduino
upload_speed = 921600
monitor_speed = 115200

build_flags =
    ; MQTT defaults — override at build time if NVS has no saved credentials:
    ;   pio run -e esp32_cyd --build-flags '-DMQTT_DEFAULT_BROKER="x.x.x.x"' ...
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_CANVAS=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.6
    https://github.com/PaulStoffregen/XPT2046_Touchscreen
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    ; h2zero/NimBLE-Arduino@^2.1.1  ; disabled — BLE removed to free DRAM
    knolleary/PubSubClient@^2.8
    tzapu/WiFiManager@^2.0
